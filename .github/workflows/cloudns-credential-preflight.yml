name: RobotGo ClouDNS - credential and API preflight (read-only)
on:
  push:
    branches: [migration/cloudns-dns]
    paths:
      - .github/workflows/cloudns-credential-preflight.yml

permissions:
  contents: read

jobs:
  verify-authorization:
    runs-on: ubuntu-latest
    environment: dns-production
    timeout-minutes: 4
    steps:
      - name: Check credential availability and read-only ClouDNS account access
        env:
          CLOUDNS_AUTH_ID: ${{ secrets.CLOUDNS_AUTH_ID }}
          CLOUDNS_SUB_AUTH_ID: ${{ secrets.CLOUDNS_SUB_AUTH_ID }}
          CLOUDNS_AUTH_PASSWORD: ${{ secrets.CLOUDNS_AUTH_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          auth_id = os.getenv("CLOUDNS_AUTH_ID", "").strip()
          sub_id = os.getenv("CLOUDNS_SUB_AUTH_ID", "").strip()
          password = os.getenv("CLOUDNS_AUTH_PASSWORD", "")
          if not (auth_id or sub_id) or not password:
              print("RESULT: CLOUDNS_CREDENTIALS_NOT_CONFIGURED")
              print("One of CLOUDNS_AUTH_ID or CLOUDNS_SUB_AUTH_ID, together with CLOUDNS_AUTH_PASSWORD, must be in GitHub Actions repository or dns-production environment secrets.")
              raise SystemExit(0)
          data = {"sub-auth-id":sub_id} if sub_id else {"auth-id":auth_id}
          data["auth-password"] = password
          request = urllib.request.Request(
              "https://api.cloudns.net/dns/get-zones-stats.json",
              data=urllib.parse.urlencode(data).encode(),
              method="POST",
              headers={"Content-Type":"application/x-www-form-urlencoded","Accept":"application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  parsed = json.loads(response.read().decode("utf-8"))
              if isinstance(parsed, dict) and str(parsed.get("status","")).lower() in ("failed","0"):
                  print("RESULT: API_AUTHENTICATION_OR_PLAN_REJECTED")
              elif isinstance(parsed, (dict, list)):
                  print("RESULT: CLOUDNS_API_READ_ACCESS_CONFIRMED")
                  print("Credentials are present and a read-only ClouDNS API call returned valid JSON.")
              else:
                  print("RESULT: UNEXPECTED_API_RESPONSE")
          except urllib.error.HTTPError as e:
              print("RESULT: API_HTTP_ERROR",e.code)
          except Exception as e:
              print("RESULT: API_CONNECTION_ERROR",type(e).__name__)
          print("NO_CHANGES: No zone created, no records modified, no RoTLD delegation changed.")
          PY
# Credential availability retry: authorized by account holder.
