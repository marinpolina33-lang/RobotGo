name: Prepare RobotGo for Render

on:
  push:
    branches: [main]
    paths:
      - "RobotGo_GitHub_Render_Pregatit.zip"
      - ".github/workflows/unpack-robotgo.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack RobotGo package into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP="RobotGo_GitHub_Render_Pregatit.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Archive already removed; nothing to do."
            exit 0
          fi

          rm -rf _robotgo_extract
          mkdir _robotgo_extract
          unzip -q -o "$ZIP" -d _robotgo_extract

          shopt -s dotglob nullglob
          entries=(_robotgo_extract/*)
          src="_robotgo_extract"

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            src="${entries[0]}"
          fi

          rsync -a --exclude=".git" --exclude=".github" "$src"/ ./
          rm -rf _robotgo_extract
          rm -f "$ZIP"
          rm -f .github/workflows/unpack-robotgo.yml

      - name: Commit prepared site
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Prepare RobotGo site files for Render"
          git push
